{% extends 'base.html' %}
{% block content %}<div class="error-page"><div class="error-code">{{ error_code }}</div><h1>{{ title }}</h1><p>{{ message }}</p><a href="{{ url_for('dashboard') if user else url_for('login') }}" class="btn btn-primary"><i data-lucide="arrow-left"></i> Kembali</a></div>{% endblock %}
{% block auth_content %}<div class="error-page"><div class="error-code">{{ error_code }}</div><h1>{{ title }}</h1><p>{{ message }}</p><a href="{{ url_for('login') }}" class="btn btn-primary">Ke Halaman Login</a></div>{% endblock %}
